<H2> islower </H2>
<!--docid::SEC2591::-->
<A NAME="SEC2592"></A>
<H3> Syntax                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         </H3>
<!--docid::SEC2592::-->
<P>

<TABLE><tr><td>&nbsp;</td><td class=example><pre>#include &#60;ctype.h&#62;

int islower(int c);
</pre></td></tr></table></P><P>

<A NAME="SEC2593"></A>
<H3> Description                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </H3>
<!--docid::SEC2593::-->
<P>

Tells if <VAR>c</VAR> is lower case or not.
</P><P>

<A NAME="SEC2594"></A>
<H3> Return Value                                                                                                                                                                                                                                                                                                                                                                                                                                       </H3>
<!--docid::SEC2594::-->
<P>

Nonzero if <VAR>c</VAR> is lower case, else zero.
</P><P>
