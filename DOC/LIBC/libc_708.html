<!--docid::SEC3679::-->
<P>

<TABLE><tr><td>&nbsp;</td><td class=example><pre>#include &#60;unistd.h&#62;

<H3> Return Value                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </H3>
<!--docid::SEC3680::-->
<P>
