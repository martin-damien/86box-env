<H2> isascii </H2>
<!--docid::SEC2560::-->
<A NAME="SEC2561"></A>
<H3> Syntax                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   </H3>
<!--docid::SEC2561::-->
<P>

<TABLE><tr><td>&nbsp;</td><td class=example><pre>#include &#60;ctype.h&#62;

int isascii(int c);
</pre></td></tr></table></P><P>

<A NAME="SEC2562"></A>
<H3> Description                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </H3>
<!--docid::SEC2562::-->
<P>

Tells if <VAR>c</VAR> is an ASCII character (0x00 to 0x7f).
</P><P>

<A NAME="SEC2563"></A>
<H3> Return Value                                                                                                                                                                                                                                                                                                                                                                                                                                 </H3>
<!--docid::SEC2563::-->
<P>

Nonzero if <VAR>c</VAR> is ASCII, else zero.
</P><P>
