<A NAME="SEC3017"></A>
<H3> Description                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </H3>
<!--docid::SEC3017::-->
<P>

Returns the current <CODE>CS</CODE>.  This is useful for setting up interrupt
vectors and such. 
</P><P>
