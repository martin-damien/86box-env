<H2> isalpha </H2>
<!--docid::SEC2555::-->
<A NAME="SEC2556"></A>
<H3> Syntax                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </H3>
<!--docid::SEC2556::-->
<P>

<TABLE><tr><td>&nbsp;</td><td class=example><pre>#include &#60;ctype.h&#62;

int isalpha(int c);
</pre></td></tr></table></P><P>

<A NAME="SEC2557"></A>
<H3> Description                                                                                                                                                                                                                                                                                                                                                                                                                                                                               </H3>
<!--docid::SEC2557::-->
<P>

Tells if <VAR>c</VAR> is a letter.
</P><P>

<A NAME="SEC2558"></A>
<H3> Return Value                                                                                                                                                                                                                                                                                                                                                                                                                                </H3>
<!--docid::SEC2558::-->
<P>

Nonzero if <VAR>c</VAR> is a letter, else zero.
</P><P>
