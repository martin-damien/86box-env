<P>

<A NAME="SEC3027"></A>
<H3> Description                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </H3>
<!--docid::SEC3027::-->
<P>

Returns the current <CODE>SS</CODE>.  This is useful for setting up interrupt
vectors and such. 
</P><P>
