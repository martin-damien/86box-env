<H2> isdigit </H2>
<!--docid::SEC2581::-->
<A NAME="SEC2582"></A>
<H3> Syntax                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       </H3>
<!--docid::SEC2582::-->
<P>

<TABLE><tr><td>&nbsp;</td><td class=example><pre>#include &#60;ctype.h&#62;

int isdigit(int c);
</pre></td></tr></table></P><P>

<A NAME="SEC2583"></A>
<H3> Description                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </H3>
<!--docid::SEC2583::-->
<P>

Tells if <VAR>c</VAR> is a digit.
</P><P>

<A NAME="SEC2584"></A>
<H3> Return Value                                                                                                                                                                                                                                                                                                                                                                                                                                     </H3>
<!--docid::SEC2584::-->
<P>

Nonzero if <VAR>c</VAR> is a digit, else zero.
</P><P>
