<H2> abs </H2>
<!--docid::SEC50::-->
<A NAME="SEC51"></A>
<H3> Syntax    </H3>
<!--docid::SEC51::-->
<P>

<TABLE><tr><td>&nbsp;</td><td class=example><pre>#include &#60;stdlib.h&#62;

int abs(int value);
</pre></td></tr></table></P><P>

<A NAME="SEC52"></A>
<H3> Return Value   </H3>
<!--docid::SEC52::-->
<P>

The absolute value of <CODE>value</CODE> is returned.
</P><P>

<A NAME="SEC53"></A>
<H3> Portability    </H3>
<!--docid::SEC53::-->
<P>

<TABLE>
<TR><TD>ANSI/ISO C</TD>
</TD><TD> C89; C99
</TR>
<TR><TD>POSIX</TD>
</TD><TD> 1003.2-1992; 1003.1-2001
</TR></TABLE>
<P>

<A NAME="SEC54"></A>
<H3> Example  </H3>
<!--docid::SEC54::-->
<P>

<TABLE><tr><td>&nbsp;</td><td class=example><pre>int sq = 7;
sq = sq * abs(sq) + 1;
</pre></td></tr></table></P><P>
