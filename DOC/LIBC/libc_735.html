<TABLE><tr><td>&nbsp;</td><td class=example><pre>#include &#60;pc.h&#62;

</pre></td></tr></table></P><P>

<A NAME="SEC3822"></A>
<H3> Description                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     </H3>
<!--docid::SEC3822::-->
<P>

Enables the PC speaker at the given frequency.  The argument
<VAR>_frequency</VAR> should be given in Hertz units.
</P><P>
