<H2> getchar </H2>
<!--docid::SEC1910::-->
<A NAME="SEC1911"></A>
<H3> Syntax                                                                                                                                                                                                                                                                                                                                                           </H3>
<!--docid::SEC1911::-->
<P>

<TABLE><tr><td>&nbsp;</td><td class=example><pre>#include &#60;stdio.h&#62;

int getchar(void);
</pre></td></tr></table></P><P>

<A NAME="SEC1912"></A>
<H3> Description                                                                                                                                                                                                                                                                                                                                                        </H3>
<!--docid::SEC1912::-->
<P>

The same as <CODE>fgetc(stdin)</CODE> (see section <A HREF="libc_317.html">fgetc</A>).
</P><P>

<A NAME="SEC1913"></A>
<H3> Return Value                                                                                                                                                                                                                                                                                                                          </H3>
<!--docid::SEC1913::-->
<P>

The character, or <CODE>EOF</CODE>.
</P><P>
