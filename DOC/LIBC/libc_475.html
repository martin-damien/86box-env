<H2> inportsb </H2>
<!--docid::SEC2412::-->
<A NAME="SEC2413"></A>
<H3> Syntax                                                                                                                                                                                                                                                                                                                                                                                                                                                      </H3>
<!--docid::SEC2413::-->
<P>

<TABLE><tr><td>&nbsp;</td><td class=example><pre>#include &#60;pc.h&#62;

void inportsb(unsigned short _port, unsigned char *_buf, unsigned _len);
</pre></td></tr></table></P><P>

<A NAME="SEC2414"></A>
<H3> Description                                                                                                                                                                                                                                                                                                                                                                                                                                                   </H3>
<!--docid::SEC2414::-->
<P>

Reads the 8-bit <VAR>_port</VAR> <VAR>_len</VAR> times, and stores the bytes in
<VAR>buf</VAR>.
</P><P>
