<H2> inportsl </H2>
<!--docid::SEC2416::-->

<!--docid::SEC2417::-->
<P>

<TABLE><tr><td>&nbsp;</td><td class=example><pre>#include &#60;pc.h&#62;

void inportsl(unsigned short _port, unsigned long *_buf, unsigned _len);
</pre></td></tr></table></P><P>

<A NAME="SEC2418"></A>
<H3> Description                                                                                                                                                                                                                                                                                                                                                                                                                                                    </H3>
<!--docid::SEC2418::-->
<P>

Reads the 32-bit <VAR>_port</VAR> <VAR>_len</VAR> times, and stores the bytes in
<VAR>buf</VAR>.
</P><P>
